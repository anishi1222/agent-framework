name: Java - Build and Test

on:
  pull_request:
    branches: ["main", "feature*"]
    paths:
      - "java/**"
      - ".github/workflows/java-build-and-test.yml"
  push:
    branches: ["main"]
    paths:
      - "java/**"
      - ".github/workflows/java-build-and-test.yml"

permissions:
  contents: read

jobs:
  java-build-and-test:
    name: Java 25 build, test, and publication smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle dependency caching
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Show Gradle and Java versions
        run: ./gradlew --version

      - name: Build and run quality checks
        run: |
          ./gradlew -p build-logic build --stacktrace
          ./gradlew clean build check --stacktrace

      - name: Verify local test publication
        run: ./gradlew publishToTestRepository --stacktrace

      - name: Verify published repository contents
        run: |
          test -f build/test-maven-repository/com/microsoft/agents/agent-framework-bom/0.1.0-SNAPSHOT/maven-metadata.xml
          test -f build/test-maven-repository/com/microsoft/agents/agent-framework-core/0.1.0-SNAPSHOT/maven-metadata.xml
